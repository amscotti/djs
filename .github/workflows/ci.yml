name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Native arm64 build plus the portable suite. The Linux job runs the full
    # gate; this one runs the checks that exercise the platform-specific code
    # (fs, net, dgram, process, child_process) and the Node differential.
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldc dub libuv openssl@3 brotli ninja cmake pkg-config coreutils

      - name: Cache the pinned QuickJS build
        uses: actions/cache@v4
        with:
          path: vendor/quickjs-ng
          key: qjs-${{ runner.os }}-${{ hashFiles('scripts/patches/quickjs-array-buffer-accounting.patch') }}

      - name: Bootstrap
        env:
          # Homebrew's LDC/libuv are newer than the Linux pins. macOS needs
          # LDC >= 1.43; the pinned 1.36 cannot run on current macOS.
          DJS_ALLOW_VERSION_DRIFT: "1"
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
        run: ./scripts/bootstrap.sh

      - name: Integration tests (builds --config=macos, runs dub test)
        run: ./scripts/integration.sh

      - name: AddressSanitizer (LSan is Linux-only)
        run: ./scripts/gate-sanitize.sh

      - name: Permission and network gates
        run: |
          ./scripts/gate-permissions.sh
          ./scripts/gate-net.sh

      - name: Express
        run: ./scripts/gate-express.sh

      - name: Differential against Node
        run: ./scripts/diff-node.sh

      - name: Package (bundled dylibs) and verify the artifact
        run: ./scripts/package.sh

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            ldc dub \
            libuv1-dev libssl-dev libbrotli-dev

      - name: Prefer the pinned distribution toolchain
        # The runner image puts newer tools in /usr/local/bin (for example
        # Ninja 1.13.2). Put the apt-installed LDC/DUB/Ninja first so the
        # versions in docs/PINS.md are the ones bootstrap.sh actually sees.
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Cache the pinned QuickJS build
        uses: actions/cache@v4
        with:
          path: vendor/quickjs-ng
          key: qjs-${{ runner.os }}-${{ hashFiles('scripts/patches/quickjs-array-buffer-accounting.patch') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Build (release)
        run: dub build -b release --compiler=ldc2

      - name: Integration tests
        run: ./scripts/integration.sh

      - name: Gate
        run: ./scripts/gate.sh
